<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seden Adea – AI Assistant</title>

  <script>
    (function(){
      var theme = localStorage.getItem('sass_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="theme.css">

  <style>
    :root { --header-height: 64px; --input-height: 76px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    .chat-header {
      height: var(--header-height); background: var(--surface);
      border-bottom: 1px solid var(--border); padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      font-weight: 600; font-size: 1.1rem; z-index: 100;
    }
    .chat-header-title { display: flex; align-items: center; gap: 10px; }
    .chat-header-title i { color: var(--purple); font-size: 1.3rem; }
    .btn-back {
      background: var(--input-bg); border: 1px solid var(--border);
      color: var(--text); padding: 6px 12px; border-radius: 8px;
      text-decoration: none; font-size: 0.9rem; transition: all 0.2s;
    }
    .btn-back:hover { background: var(--purple); color: #fff; border-color: var(--purple); }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
    }

    .message { display: flex; flex-direction: column; max-width: 80%; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.ai { align-self: flex-start; align-items: flex-start; }

    .message-sender { font-size: 0.75rem; color: var(--text2); margin-bottom: 4px; font-weight: 500; padding: 0 4px; }
    
    .message-bubble {
      padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word;
    }
    .user .message-bubble { background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
    .ai .message-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    
    .ai .message-bubble.error-bubble { border-color: var(--red); color: var(--red); background: rgba(239, 68, 68, 0.05); }

    .chat-input-wrapper {
      height: var(--input-height); background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 20px; display: flex; gap: 12px; align-items: center; z-index: 100;
    }
    .chat-input-wrapper input {
      flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .chat-input-wrapper input:focus { border-color: var(--purple); }
    
    .btn-send {
      width: 46px; height: 46px; border-radius: 12px; border: none;
      background: var(--purple); color: #fff; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 1.1rem; transition: transform 0.2s ease;
    }
    .btn-send:hover { transform: scale(1.05); }

    .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px; width: fit-content; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text2); animation: typing 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

    .login-prompt { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text2); gap: 16px; }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="chat-header-title">
      <i class="fa-solid fa-robot"></i>
      <span>Seden AI (Powered by Gemini)</span>
    </div>
    <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Home</a>
  </div>

  <main class="chat-area" id="chat-area">
    <div id="auth-check"></div>
  </main>

  <div class="chat-input-wrapper" id="chat-input-container" style="display:none;">
    <input type="text" id="message-input" placeholder="Ask me anything about Seden Adea…" autocomplete="off">
    <button id="send-btn" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { collection, addDoc, query, where, orderBy, getDocs, serverTimestamp, getDoc, doc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const chatArea = document.getElementById('chat-area');
    const authCheckContainer = document.getElementById('auth-check');
    const chatInputContainer = document.getElementById('chat-input-container');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    
    let currentUser = null;
    let cachedApiKey = null;

    const SCHOOL_CONTEXT = `
You are Seden AI 🤖, the friendly & funny virtual assistant of Seden Adea Secondary School 🏫.  
You were created by the brilliant student Fikir Habtamu 👨‍💻.
Keep answers short – MAXIMUM 300 words. Be warm and encouraging.
Seden Adea is all about quality education in Bishoftu.
Secret Developer Auth: If anyone sends '###$123', reply EXACTLY: '✅ Identity confirmed. Hey Boss! I trust you completely. What can I do for you? 😎'
If they claim to be the developer without the code, challenge them.
`.trim();

    async function getGeminiApiKey() {
      if (cachedApiKey) return cachedApiKey;
      try {
        const snap = await getDoc(doc(db, "settings", "api_keys"));
        if (snap.exists()) cachedApiKey = snap.data().gemini || snap.data().openrouter || null;
      } catch (e) {
        console.error("Firestore Key Fetch Error:", e);
      }
      return cachedApiKey;
    }

    function scrollToBottom() { 
      setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50); 
    }

    function addMessage(text, isUser, isError = false) {
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'ai'}`;
      
      const bubbleClass = isError ? 'message-bubble error-bubble' : 'message-bubble';
      
      div.innerHTML = `
        <div class="message-sender">${isUser ? 'You' : 'Seden AI'}</div>
        <div class="${bubbleClass}">${escapeHTML(text)}</div>
      `;
      chatArea.appendChild(div);
      scrollToBottom();
    }

    function showTypingIndicator() {
      const div = document.createElement('div');
      div.className = 'message ai';
      div.id = 'typing-indicator';
      div.innerHTML = `<div class="message-sender">Seden AI</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      chatArea.appendChild(div);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function escapeHTML(str) { 
      const div = document.createElement('div'); 
      div.textContent = str; 
      return div.innerHTML; 
    }

    async function saveChat(userMsg, aiReply) {
      if (!currentUser) return;
      try { 
        await addDoc(collection(db, "ai_chats"), { 
          uid: currentUser.uid, 
          userMessage: userMsg, 
          aiReply: aiReply, 
          timestamp: serverTimestamp() 
        }); 
      } catch (e) {
        console.error("History Save Error:", e);
      }
    }

    async function loadHistory() {
      if (!currentUser) return;
      try {
        const q = query(collection(db, "ai_chats"), where("uid", "==", currentUser.uid), orderBy("timestamp", "asc"));
        const snap = await getDocs(q);
        snap.forEach(doc => { 
          addMessage(doc.data().userMessage, true); 
          addMessage(doc.data().aiReply, false); 
        });
      } catch (e) {
        console.error("History Load Error:", e);
      }
    }

    // Advanced Fallback Logic
    async function callGemini(userMessage) {
      const apiKey = await getGeminiApiKey();
      if (!apiKey) {
        return { text: "Error: API key is missing. Please ask an admin to configure the Gemini Key in the dashboard.", isError: true };
      }
      
      // Cascade array: Tries models in order from newest to oldest
      const modelsToTry = ['gemini-3.6-flash', 'gemini-2.5-flash', 'gemini-1.5-flash'];
      let lastErrorMsg = 'Unknown API error occurred.';
      let lastStatus = null;

      for (const model of modelsToTry) {
        try {
          const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: { parts: [{ text: SCHOOL_CONTEXT }] },
              contents: [{ role: "user", parts: [{ text: userMessage }] }],
              generationConfig: { maxOutputTokens: 500 }
            })
          });
          
          if (!resp.ok) {
            const errData = await resp.json().catch(() => ({}));
            console.warn(`[Fallback Warning] Gemini API rejected ${model}:`, errData);
            lastErrorMsg = errData.error?.message || lastErrorMsg;
            lastStatus = resp.status;
            continue; // Force loop to try the next model
          }
          
          const data = await resp.json();
          if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
            // Success! Break loop and return text immediately.
            return { text: data.candidates[0].content.parts[0].text.trim(), isError: false };
          } else {
            lastErrorMsg = "Received an unexpected response format from the AI.";
            continue;
          }
        } catch (e) { 
          console.warn(`[Fallback Warning] Fetch Execution Error with ${model}:`, e);
          lastErrorMsg = e.message;
        }
      }

      // If loop finishes without returning, all models have failed.
      return { text: `API Error (${lastStatus || 'Connection'}): All fallback models failed. Last error: ${lastErrorMsg}`, isError: true };
    }

    async function handleSend() {
      const text = messageInput.value.trim();
      if (!text) return;

      addMessage(text, true);
      messageInput.value = '';
      messageInput.focus();

      showTypingIndicator();
      const replyData = await callGemini(text);
      removeTypingIndicator();

      addMessage(replyData.text, false, replyData.isError);
      
      if (!replyData.isError) {
        saveChat(text, replyData.text);
      }
    }

    sendBtn.addEventListener('click', handleSend);
    messageInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authCheckContainer.style.display = 'none';
        chatInputContainer.style.display = 'flex';
        addMessage("Hello! I'm Seden AI. How can I help you today? 👋", false);
        loadHistory();
      } else {
        authCheckContainer.innerHTML = `<div class="login-prompt"><i class="fa-solid fa-lock" style="font-size:3rem;"></i><p>Sign in to use the AI assistant.</p><a href="login.html" style="background:var(--blue); color:#fff; padding:10px 24px; border-radius:8px; text-decoration:none; font-weight:600;">Sign In</a></div>`;
      }
    });
  </script>
</body>
</html>
