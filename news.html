<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seden Adea – Announcements</title>

  <script>
    (function(){
      var theme = localStorage.getItem('sass_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="theme.css">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 800px; margin: 0 auto; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
    }
    .header h1 {
      font-size: 2rem; font-weight: 800;
      color: var(--text); letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 12px;
    }
    .header h1 i { color: var(--blue); }

    .header-actions { display: flex; gap: 12px; align-items: center; }
    .btn {
      padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); text-decoration: none;
      font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer; transition: all 0.2s ease; font-size: 0.95rem;
    }
    .btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

    .announcement-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
      box-shadow: var(--shadow); transition: transform 0.2s ease, border-color 0.2s ease;
      border-left: 4px solid var(--blue);
      animation: fadeIn 0.4s ease forwards;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }

    .announcement-card:hover { transform: translateY(-3px); border-color: var(--blue); }

    .announcement-card h3 { color: var(--text); margin-bottom: 12px; font-size: 1.2rem; }
    .announcement-card p { color: var(--text2); line-height: 1.6; font-size: 0.95rem; }
    .date-badge {
      font-size: 0.8rem; color: var(--text2); margin-top: 16px;
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--bg); padding: 6px 12px; border-radius: 8px; font-weight: 500;
    }

    .loading-state { text-align: center; padding: 60px 0; color: var(--text2); }
    .spinner-ring {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-newspaper"></i> Broadcasts</h1>
      <div class="header-actions">
        
      </div>
    </div>

    <div id="news-container">
      <div class="loading-state">
        <div class="spinner-ring"></div>
        <p>Loading latest school announcements…</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    function escapeHTML(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

    const container = document.getElementById('news-container');

    // OPTIMIZATION: Switched to onSnapshot so students see announcements instantly when an admin posts them
    const q = query(collection(db, "announcements"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (snapshot) => {
      if (snapshot.empty) {
        container.innerHTML = `
          <div style="text-align:center; padding:60px 20px; color:var(--text2); background:var(--surface); border:1px solid var(--border); border-radius:16px;">
            <i class="fa-solid fa-inbox" style="font-size:3rem; display:block; margin-bottom:16px; color:var(--border);"></i>
            <p>No active announcements right now. Have a great day!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = ''; // Rebuild list
      snapshot.forEach(doc => {
        const a = doc.data();
        const date = a.timestamp ? new Date(a.timestamp).toLocaleDateString('en-US', {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : 'Unknown date';
        
        const card = document.createElement('div');
        card.className = 'announcement-card';
        card.innerHTML = `
          <h3>${escapeHTML(a.title)}</h3>
          <p>${escapeHTML(a.content)}</p>
          <div class="date-badge"><i class="fa-solid fa-clock"></i> ${date}</div>
        `;
        container.appendChild(card);
      });
    }, (error) => {
      container.innerHTML = '<div class="loading-state"><p style="color:var(--red);">Failed to establish live connection. Check your internet.</p></div>';
    });
  </script>
</body>
</html>
