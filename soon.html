<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Seden Adea – Coming Soon</title>

  <script>
    (function(){
      var theme = localStorage.getItem('sass_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="theme.css">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden; transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container { position: relative; text-align: center; padding: 24px; }

    /* Morphing Orb */
    .orb { position: relative; width: 100px; height: 100px; margin: 0 auto 40px; }
    .orb-core {
      width: 100%; height: 100%; border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
      animation: morphOrb 4s ease-in-out infinite; position: absolute; top: 0; left: 0;
    }
    @keyframes morphOrb {
      0%, 100% { border-radius: 50% 50% 50% 50%; transform: scale(1) rotate(0deg); }
      25% { border-radius: 60% 40% 60% 40%; transform: scale(1.1) rotate(90deg); }
      50% { border-radius: 40% 60% 40% 60%; transform: scale(1.05) rotate(180deg); }
      75% { border-radius: 55% 45% 55% 45%; transform: scale(1.1) rotate(270deg); }
    }

    .orb-logo {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 2rem; color: #fff; z-index: 2; animation: pulseText 2s ease-in-out infinite;
    }
    @keyframes pulseText { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.08); } }

    /* Progress bar */
    .progress-track {
      width: 240px; height: 4px; background: var(--border);
      border-radius: 4px; margin: 0 auto 24px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--blue), var(--purple));
      border-radius: 4px; animation: fillBar 2.5s ease-out forwards;
    }
    @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }

    /* Text */
    .coming-text {
      font-size: 1.8rem; font-weight: 800; color: var(--text);
      opacity: 0; animation: fadeInUp 0.8s ease 2.7s forwards; margin-bottom: 8px; letter-spacing: -0.5px;
    }
    .sub-text {
      color: var(--text2); font-size: 0.95rem; opacity: 0; animation: fadeInUp 0.8s ease 3s forwards; margin-bottom: 30px;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .back-link { opacity: 0; animation: fadeInUp 0.8s ease 3.3s forwards; }
    .back-link a {
      color: var(--text2); text-decoration: none; font-size: 0.9rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s ease;
    }
    .back-link a:hover { color: var(--blue); }
  </style>
</head>
<body>
  <div class="container">
    <div class="orb">
      <div class="orb-core"></div>
      <div class="orb-logo"><i class="fa-solid fa-graduation-cap"></i></div>
    </div>

    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <h1 class="coming-text">Feature in Development</h1>
    <p class="sub-text">We are preparing this tool for the upcoming semester.</p>

    <div class="back-link">
      <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Return Home</a>
    </div>
  </div>
</body>
</html>
